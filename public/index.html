<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EBC Room Availability</title>

<style>

/* =========================================================
   GLOBAL
========================================================= */

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    background:
        radial-gradient(
            circle at 50% -15%,
            rgba(255, 55, 55, 0.12),
            transparent 38%
        ),
        radial-gradient(
            circle at 100% 30%,
            rgba(255, 180, 60, 0.05),
            transparent 30%
        ),
        #050505;

    color: #f5f5f5;

    overflow-x: hidden;
}


/* =========================================================
   BACKGROUND EFFECT
========================================================= */

body::before {
    content: "";

    position: fixed;
    inset: 0;

    pointer-events: none;

    background:
        linear-gradient(
            120deg,
            transparent 0%,
            rgba(255,255,255,0.015) 45%,
            transparent 70%
        );

    animation: backgroundMove 10s ease-in-out infinite alternate;

    z-index: -1;
}

@keyframes backgroundMove {

    from {
        transform: translateX(-3%);
    }

    to {
        transform: translateX(3%);
    }

}


/* =========================================================
   CONTAINER
========================================================= */

.container {
    max-width: 1200px;

    margin: auto;

    padding: 55px 28px 60px;
}


/* =========================================================
   HEADER
========================================================= */

.header {
    display: flex;

    align-items: center;

    gap: 18px;

    animation:
        headerEnter
        0.8s
        cubic-bezier(.2,.8,.2,1)
        both;
}


.hotel-icon {
    width: 58px;
    height: 58px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 16px;

    background:
        linear-gradient(
            145deg,
            #1d1d1d,
            #0c0c0c
        );

    border: 1px solid rgba(255,255,255,0.10);

    box-shadow:
        0 12px 35px rgba(0,0,0,0.45),
        inset 0 1px 0 rgba(255,255,255,0.06);

    font-size: 35px;

    animation:
        mountainFloat
        4s
        ease-in-out
        infinite;
}


.title {
    font-size: 42px;

    font-weight: 800;

    letter-spacing: -1.2px;

    color: #ffffff;
}


.subtitle {
    font-size: 22px;

    font-weight: 600;

    margin:
        8px 0 35px;

    color: #bdbdbd;

    animation:
        subtitleEnter
        0.9s
        ease
        both;
}


/* red underline */

.subtitle::after {
    content: "";

    display: block;

    width: 70px;
    height: 3px;

    margin-top: 12px;

    border-radius: 10px;

    background:
        linear-gradient(
            90deg,
            #ff3f3f,
            #ff7777
        );

    box-shadow:
        0 0 15px rgba(255,60,60,0.35);

    animation:
        lineGrow
        1s
        ease
        both;
}


/* =========================================================
   DATE SECTION
========================================================= */

.date-grid {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 60px;

    margin-bottom: 34px;

    animation:
        fieldsEnter
        0.9s
        0.15s
        ease
        both;
}


.field label {

    display: block;

    font-size: 15px;

    font-weight: 600;

    margin-bottom: 9px;

    color: #c9c9c9;
}


.field input {

    width: 100%;

    height: 52px;

    border:
        1px solid
        #292929;

    border-radius: 10px;

    background:
        linear-gradient(
            145deg,
            #181818,
            #101010
        );

    color: #ffffff;

    padding:
        0 14px;

    font-size: 15px;

    outline: none;

    transition:
        border-color 0.25s ease,
        box-shadow 0.25s ease,
        transform 0.25s ease,
        background 0.25s ease;
}


.field input:hover {

    border-color:
        #3d3d3d;

}


.field input:focus {

    border-color:
        #ff4242;

    background:
        #151515;

    box-shadow:
        0 0 0 3px
        rgba(255,60,60,0.10),

        0 8px 25px
        rgba(0,0,0,0.35);

    transform:
        translateY(-1px);
}


.field input::-webkit-calendar-picker-indicator {

    filter: invert(1);

    opacity: 0.8;

    cursor: pointer;

}


/* =========================================================
   SEARCH BUTTON
========================================================= */

.search-button {

    position: relative;

    width: 100%;

    min-height: 52px;

    border: 0;

    border-radius: 10px;

    background:
        linear-gradient(
            135deg,
            #ff4b4b,
            #e32626
        );

    color: #ffffff;

    font-size: 16px;

    font-weight: 650;

    cursor: pointer;

    margin-bottom: 26px;

    overflow: hidden;

    box-shadow:
        0 10px 28px
        rgba(255,55,55,0.18);

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        filter 0.2s ease;

    animation:
        buttonEnter
        0.9s
        0.25s
        ease
        both;
}


/* animated shine */

.search-button::before {

    content: "";

    position: absolute;

    top: 0;

    left: -120%;

    width: 65%;

    height: 100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,0.20),
            transparent
        );

    transform:
        skewX(-20deg);

    transition:
        left 0.7s ease;
}


.search-button:hover::before {

    left: 150%;

}


.search-button:hover {

    transform:
        translateY(-2px);

    box-shadow:
        0 15px 35px
        rgba(255,55,55,0.28);

    filter:
        brightness(1.06);

}


.search-button:active {

    transform:
        translateY(0);

}


.search-button:disabled {

    opacity: 0.72;

    cursor: wait;

    transform: none;

}


/* =========================================================
   ALERT
========================================================= */

.alert {

    padding:
        20px 18px;

    border-radius: 10px;

    margin-bottom: 36px;

    font-size: 16px;

    animation:
        alertEnter
        0.45s
        cubic-bezier(.2,.8,.2,1)
        both;
}


.success {

    background:
        rgba(35, 190, 100, 0.10);

    color:
        #48e58b;

    border:
        1px solid
        rgba(70,220,130,0.18);

    box-shadow:
        0 8px 25px
        rgba(0,0,0,0.15);

}


.error {

    background:
        rgba(255,60,60,0.10);

    color:
        #ff7777;

    border:
        1px solid
        rgba(255,60,60,0.20);

}


.warning {

    background:
        rgba(255,193,7,0.09);

    color:
        #ffd45c;

    border:
        1px solid
        rgba(255,193,7,0.18);

}


.hidden {

    display: none;

}


/* =========================================================
   LOADING
========================================================= */

.loading {

    display:
        inline-flex;

    align-items:
        center;

    gap:
        8px;

}


.spinner {

    width:
        15px;

    height:
        15px;

    border:
        2px solid
        rgba(255,255,255,0.35);

    border-top-color:
        #ffffff;

    border-radius:
        50%;

    animation:
        spin
        0.8s
        linear
        infinite;

}


/* =========================================================
   ROOM AVAILABILITY SUMMARY
   DO NOT CHANGE
========================================================= */

.summary-header {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 17px;

}


.summary-title {

    font-size: 30px;

    font-weight: 750;

}


.copy-button {

    min-width: 42px;

    height: 42px;

    border:
        1px solid
        rgba(128,128,128,.45);

    border-radius: 8px;

    background: transparent;

    color: inherit;

    font-size: 18px;

    cursor: pointer;

    padding: 0 10px;

    white-space: nowrap;

}


.copy-button.copied {

    min-width: 88px;

    font-size: 14px;

    font-weight: 600;

}


.summary-intro {

    font-size: 16px;

    font-weight: 600;

    line-height: 1.5;

    margin-bottom: 10px;

}


.room-line {

    font-size: 16px;

    line-height: 1.5;

    margin: 0;

}


/* =========================================================
   ANIMATIONS
========================================================= */

@keyframes spin {

    to {
        transform:
            rotate(360deg);
    }

}


@keyframes headerEnter {

    from {

        opacity: 0;

        transform:
            translateY(-20px);

    }

    to {

        opacity: 1;

        transform:
            translateY(0);

    }

}


@keyframes subtitleEnter {

    from {

        opacity: 0;

        transform:
            translateY(12px);

    }

    to {

        opacity: 1;

        transform:
            translateY(0);

    }

}


@keyframes fieldsEnter {

    from {

        opacity: 0;

        transform:
            translateY(18px);

    }

    to {

        opacity: 1;

        transform:
            translateY(0);

    }

}


@keyframes buttonEnter {

    from {

        opacity: 0;

        transform:
            translateY(18px);

    }

    to {

        opacity: 1;

        transform:
            translateY(0);

    }

}


@keyframes alertEnter {

    from {

        opacity: 0;

        transform:
            translateY(-8px);

    }

    to {

        opacity: 1;

        transform:
            translateY(0);

    }

}


@keyframes mountainFloat {

    0%,
    100% {

        transform:
            translateY(0);

    }

    50% {

        transform:
            translateY(-4px);

    }

}


@keyframes lineGrow {

    from {

        width: 0;

        opacity: 0;

    }

    to {

        width: 70px;

        opacity: 1;

    }

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:768px) {

    .container {

        padding:
            30px 18px 40px;

    }


    .title {

        font-size:
            30px;

    }


    .hotel-icon {

        width:
            48px;

        height:
            48px;

        font-size:
            28px;

    }


    .subtitle {

        font-size:
            19px;

    }


    .date-grid {

        grid-template-columns:
            1fr;

        gap:
            20px;

    }


    .summary-title {

        font-size:
            25px;

    }


    .summary-intro,
    .room-line {

        font-size:
            15px;

    }

}


/* =========================================================
   SMALL MOBILE
========================================================= */

@media(max-width:420px) {

    .container {

        padding:
            25px 15px 35px;

    }


    .title {

        font-size:
            25px;

    }


    .subtitle {

        font-size:
            17px;

    }


    .hotel-icon {

        width:
            44px;

        height:
            44px;

        font-size:
            25px;

    }


    .summary-title {

        font-size:
            22px;

    }

}

</style>
</head>


<body>

<div class="container">

    <!-- HEADER -->

    <div class="header">

        <div class="hotel-icon">
            🏔️
        </div>

        <div class="title">
            Everest Base Camp
        </div>

    </div>


    <div class="subtitle">
        Room Availability &amp; Price Checker
    </div>


    <!-- DATE INPUTS -->

    <div class="date-grid">

        <div class="field">

            <label for="checkIn">
                Check-in Date
            </label>

            <input
                type="date"
                id="checkIn"
            >

        </div>


        <div class="field">

            <label for="checkOut">
                Check-out Date
            </label>

            <input
                type="date"
                id="checkOut"
            >

        </div>

    </div>


    <!-- SEARCH BUTTON -->

    <button
        class="search-button"
        id="searchButton"
        onclick="checkAvailability()"
    >
        🔍 Check Availability
    </button>


    <!-- ALERT -->

    <div
        id="alert"
        class="alert hidden"
    ></div>


    <!-- =====================================================
         ROOM AVAILABILITY SUMMARY
         ORIGINAL STRUCTURE
    ====================================================== -->

    <div
        id="summary"
        class="hidden"
    >

        <div class="summary-header">

            <div class="summary-title">
                Room Availability Summary
            </div>

            <button
                id="copyButton"
                class="copy-button"
                onclick="copySummary()"
                title="Copy Summary"
            >
                📋
            </button>

        </div>


        <div id="summaryContent"></div>

    </div>

</div>


<script>

/* =========================================================
   ELEMENTS
========================================================= */

const checkIn =
    document.getElementById("checkIn");

const checkOut =
    document.getElementById("checkOut");

const searchButton =
    document.getElementById("searchButton");

const alertBox =
    document.getElementById("alert");

const summary =
    document.getElementById("summary");

const summaryContent =
    document.getElementById("summaryContent");

const copyButton =
    document.getElementById("copyButton");


/* =========================================================
   DATE FUNCTIONS
========================================================= */

function toISODate(d) {

    return `${d.getFullYear()}-${String(
        d.getMonth() + 1
    ).padStart(2,"0")}-${String(
        d.getDate()
    ).padStart(2,"0")}`;

}


function formatDate(d) {

    return `${String(
        d.getDate()
    ).padStart(2,"0")}-${String(
        d.getMonth() + 1
    ).padStart(2,"0")}-${d.getFullYear()}`;

}


function nextDay(s) {

    const d =
        new Date(s + "T00:00:00");

    d.setDate(
        d.getDate() + 1
    );

    return toISODate(d);

}


/* =========================================================
   INITIAL DATE
========================================================= */

const today =
    new Date();

const tomorrow =
    new Date();

tomorrow.setDate(
    tomorrow.getDate() + 1
);

checkIn.value =
    toISODate(today);

checkOut.value =
    toISODate(tomorrow);

checkIn.min =
    toISODate(today);


/* =========================================================
   CHECK-IN CHANGE
========================================================= */

checkIn.addEventListener(
    "change",
    () => {

        if (!checkIn.value)
            return;

        checkOut.min =
            nextDay(checkIn.value);

        checkOut.value =
            nextDay(checkIn.value);

    }
);


/* =========================================================
   CHECK-OUT CHANGE
========================================================= */

checkOut.addEventListener(
    "change",
    () => {

        if (
            checkIn.value &&
            checkOut.value <
            nextDay(checkIn.value)
        ) {

            checkOut.value =
                nextDay(checkIn.value);

        }

    }
);


/* =========================================================
   ALERT
========================================================= */

function showAlert(m,t) {

    alertBox.className =
        "alert " + t;

    alertBox.textContent =
        m;

    alertBox.classList.remove(
        "hidden"
    );

}


function hideAlert() {

    alertBox.classList.add(
        "hidden"
    );

}


/* =========================================================
   OCCUPANTS
========================================================= */

function getOccupants(n) {

    return n ===
        "The Surveyor suite room"
        ? 4
        : 2;

}


/* =========================================================
   ROOM LINE
   ORIGINAL LOGIC
========================================================= */

function buildRoomLine(r) {

    let p =
        Number(r.price)
        .toLocaleString("en-IN");

    let line =
        `${r.name} (${getOccupants(r.name)} occupants) is available for Rs. ${p} plus taxes per night.`;

    if (
        r.name === "The Glamper room" &&
        r.available > 0
    )

        line +=
            ` (We have ${r.available} Glamper room${r.available===1?"":"s"})`;

    else if (
        r.name === "The Camper room" &&
        r.available > 0
    )

        line +=
            ` (We have ${r.available} Camper room${r.available===1?"":"s"})`;

    else if (
        r.name === "The Surveyor room" &&
        r.available > 0
    )

        line +=
            ` (We have ${r.available} Surveyor room${r.available===1?"":"s"})`;

    else if (
        r.name === "The Surveyor suite room" &&
        r.available > 0
    )

        line +=
            ` (We have ${r.available} Surveyor suite room${r.available===1?"":"s"})`;

    else if (
        r.name === "The Zenith luxury cottage" &&
        r.available > 0
    )

        line +=
            ` (We have ${r.available} Zenith luxury cottage${r.available===1?"":"s"})`;

    else if (
        r.name === "The Twin luxury cottage"
    )

        line +=
            " (2 Rooms next to each other)";

    else if (
        r.name === "The Villa"
    )

        line +=
            " (2 Rooms villa)";

    return line;

}


/* =========================================================
   CHECK AVAILABILITY
========================================================= */

async function checkAvailability() {

    hideAlert();

    summary.classList.add(
        "hidden"
    );

    const start =
        checkIn.value;

    const end =
        checkOut.value;


    if (!start || !end) {

        showAlert(
            "Please select both dates.",
            "error"
        );

        return;

    }


    if (end <= start) {

        showAlert(
            "Check-out date must be after check-in date.",
            "error"
        );

        return;

    }


    searchButton.disabled =
        true;

    searchButton.innerHTML =
        '<span class="loading"><span class="spinner"></span>Fetching live availability...</span>';


    try {

        const response =
            await fetch(
                `/api/availability?check_in=${encodeURIComponent(start)}&check_out=${encodeURIComponent(end)}&adults=2&children=0&rooms=1`
            );


        let data;

        try {

            data =
                await response.json();

        }

        catch {

            throw new Error(
                "The server returned an invalid response."
            );

        }


        if (!response.ok)

            throw new Error(
                data.detail ||
                "Unable to fetch room availability."
            );


        if (
            !data.available ||
            !data.rooms ||
            !data.rooms.length
        ) {

            showAlert(
                "No rooms are available for the selected dates.",
                "warning"
            );

            return;

        }


        showAlert(
            "Availability fetched successfully!",
            "success"
        );

        renderSummary(data);

    }

    catch(e) {

        showAlert(
            e.message ||
            "Unable to fetch room availability.",
            "error"
        );

    }

    finally {

        searchButton.disabled =
            false;

        searchButton.innerHTML =
            "🔍 Check Availability";

    }

}


/* =========================================================
   SUMMARY
   ORIGINAL
========================================================= */

function renderSummary(data) {

    const s =
        new Date(
            data.check_in +
            "T00:00:00"
        );

    const e =
        new Date(
            data.check_out +
            "T00:00:00"
        );

    const dateText =
        `${formatDate(s)} - ${formatDate(e)}`;


    let html =
        `<div class="summary-intro">For ${dateText}, Here is the Room availability with prices below:</div>`;


    for (
        const r of data.rooms
    )

        html +=
            `<div class="room-line">${escapeHtml(buildRoomLine(r))}</div>`;


    summaryContent.innerHTML =
        html;

    summary.classList.remove(
        "hidden"
    );

    window.summaryCopyText =
        buildCopyText(data);

}


/* =========================================================
   COPY SUMMARY
========================================================= */

function buildCopyText(data) {

    const s =
        new Date(
            data.check_in +
            "T00:00:00"
        );

    const e =
        new Date(
            data.check_out +
            "T00:00:00"
        );

    const lines = [
        `For ${formatDate(s)} - ${formatDate(e)}, Here is the Room availability with prices below:`
    ];

    for (
        const r of data.rooms
    )

        lines.push(
            buildRoomLine(r)
        );

    return lines.join("\n");

}


/* =========================================================
   COPY BUTTON
========================================================= */

async function copySummary() {

    const text =
        window.summaryCopyText ||
        "";

    if (!text)
        return;


    try {

        await navigator.clipboard
            .writeText(text);

        showCopied();

    }

    catch {

        const t =
            document.createElement(
                "textarea"
            );

        t.value =
            text;

        t.style.position =
            "fixed";

        t.style.left =
            "-999999px";

        document.body.appendChild(
            t
        );

        t.focus();

        t.select();


        let ok = false;

        try {

            ok =
                document.execCommand(
                    "copy"
                );

        }

        catch {}


        t.remove();


        if (ok)

            showCopied();

        else {

            copyButton.innerHTML =
                "✕ Failed";

            setTimeout(
                resetCopyButton,
                1800
            );

        }

    }

}


function showCopied() {

    copyButton.innerHTML =
        "✓ Copied";

    copyButton.classList.add(
        "copied"
    );

    copyButton.title =
        "Copied";

    setTimeout(
        resetCopyButton,
        1500
    );

}


function resetCopyButton() {

    copyButton.innerHTML =
        "📋";

    copyButton.classList.remove(
        "copied"
    );

    copyButton.title =
        "Copy Summary";

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(v) {

    return String(v)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}

</script>

</body>
</html>
