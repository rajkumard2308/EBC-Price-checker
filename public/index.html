<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EBC Room Availability</title>

<style>

/* =========================================================
   PREMIUM OBSIDIAN THEME
========================================================= */

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    color: #f4f5f7;

    background:
        radial-gradient(
            ellipse 80% 45% at 50% -10%,
            rgba(112, 174, 207, 0.12),
            transparent 65%
        ),
        radial-gradient(
            ellipse 45% 35% at 95% 15%,
            rgba(211, 176, 106, 0.07),
            transparent 65%
        ),
        radial-gradient(
            ellipse 40% 35% at 5% 80%,
            rgba(88, 135, 165, 0.06),
            transparent 65%
        ),
        #07080a;

    overflow-x: hidden;
}


/* =========================================================
   AMBIENT BACKGROUND
========================================================= */

body::before {
    content: "";

    position: fixed;

    width: 650px;
    height: 650px;

    top: -350px;
    left: 50%;

    transform: translateX(-50%);

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(145, 205, 231, 0.08),
            transparent 68%
        );

    filter: blur(25px);

    pointer-events: none;

    animation:
        ambientGlow 9s ease-in-out infinite alternate;

    z-index: -2;
}


body::after {
    content: "";

    position: fixed;
    inset: 0;

    pointer-events: none;

    background:
        linear-gradient(
            115deg,
            transparent 0%,
            rgba(255,255,255,0.012) 45%,
            transparent 65%
        );

    animation:
        lightSweep 12s ease-in-out infinite alternate;

    z-index: -1;
}


/* =========================================================
   CONTAINER
========================================================= */

.container {
    max-width: 1120px;

    margin: auto;

    padding:
        58px 28px 70px;
}


/* =========================================================
   HEADER
========================================================= */

.header {
    display: flex;

    align-items: center;

    gap: 17px;

    opacity: 0;

    animation:
        headerReveal
        0.9s
        cubic-bezier(.16,1,.3,1)
        0.1s
        forwards;
}


.hotel-icon {
    position: relative;

    width: 62px;
    height: 62px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 18px;

    background:
        linear-gradient(
            145deg,
            rgba(35,39,43,0.95),
            rgba(15,17,20,0.95)
        );

    border:
        1px solid
        rgba(255,255,255,0.11);

    box-shadow:
        0 18px 45px rgba(0,0,0,0.45),
        inset 0 1px 0 rgba(255,255,255,0.08);

    font-size: 35px;

    overflow: hidden;

    animation:
        iconFloat
        5s
        ease-in-out
        infinite;
}


/* subtle icon glow */

.hotel-icon::after {
    content: "";

    position: absolute;

    width: 35px;
    height: 35px;

    border-radius: 50%;

    background:
        rgba(132,198,225,0.14);

    filter: blur(16px);

    pointer-events: none;
}


.title {
    font-size: 43px;

    font-weight: 800;

    letter-spacing: -1.7px;

    color: #f7f7f8;
}


/* =========================================================
   SUBTITLE
========================================================= */

.subtitle {
    font-size: 20px;

    font-weight: 550;

    color: #9da2a8;

    margin:
        9px 0 42px 79px;

    opacity: 0;

    animation:
        fadeUp
        0.8s
        cubic-bezier(.16,1,.3,1)
        0.35s
        forwards;
}


.subtitle::after {
    content: "";

    display: block;

    width: 52px;
    height: 2px;

    margin-top: 15px;

    border-radius: 20px;

    background:
        linear-gradient(
            90deg,
            #d6b36a,
            #8ccbe8
        );

    box-shadow:
        0 0 14px
        rgba(190,165,105,0.20);

    animation:
        lineReveal
        0.8s
        ease
        0.7s
        both;
}


/* =========================================================
   DATE GRID
========================================================= */

.date-grid {
    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 35px;

    margin-bottom: 27px;

    opacity: 0;

    animation:
        fadeUp
        0.85s
        cubic-bezier(.16,1,.3,1)
        0.5s
        forwards;
}


.field label {
    display: block;

    margin-bottom: 10px;

    color: #b8bdc3;

    font-size: 13px;

    font-weight: 650;

    letter-spacing: 0.45px;

    text-transform: uppercase;
}


.field input {
    width: 100%;

    height: 57px;

    padding:
        0 17px;

    border:
        1px solid
        rgba(255,255,255,0.10);

    border-radius: 13px;

    outline: none;

    color: #f2f4f5;

    background:
        linear-gradient(
            145deg,
            rgba(28,31,34,0.88),
            rgba(17,19,22,0.92)
        );

    box-shadow:
        inset 0 1px 0
        rgba(255,255,255,0.035),
        0 12px 30px
        rgba(0,0,0,0.18);

    font-size: 15px;

    transition:
        border-color .3s ease,
        box-shadow .3s ease,
        transform .3s ease,
        background .3s ease;
}


.field input:hover {
    border-color:
        rgba(255,255,255,0.18);

    transform:
        translateY(-1px);
}


.field input:focus {
    border-color:
        rgba(145,205,231,0.55);

    background:
        linear-gradient(
            145deg,
            rgba(31,35,39,0.95),
            rgba(18,21,24,0.98)
        );

    box-shadow:
        0 0 0 3px
        rgba(140,203,232,0.07),

        0 14px 35px
        rgba(0,0,0,0.30);

    transform:
        translateY(-2px);
}


.field input::-webkit-calendar-picker-indicator {
    filter:
        invert(1)
        opacity(.75);

    cursor: pointer;
}


/* =========================================================
   CHECK AVAILABILITY BUTTON
========================================================= */

.search-button {
    position: relative;

    width: 100%;

    min-height: 57px;

    margin-bottom: 28px;

    border:
        1px solid
        rgba(214,179,106,0.35);

    border-radius: 13px;

    color: #f7f5ef;

    background:
        linear-gradient(
            135deg,
            #c9a35d 0%,
            #ad8749 45%,
            #d4b36c 100%
        );

    box-shadow:
        0 14px 35px
        rgba(0,0,0,0.35),

        inset 0 1px 0
        rgba(255,255,255,0.25);

    font-size: 16px;

    font-weight: 700;

    letter-spacing: 0.1px;

    cursor: pointer;

    overflow: hidden;

    transition:
        transform .25s ease,
        box-shadow .25s ease,
        filter .25s ease;

    opacity: 0;

    animation:
        buttonReveal
        .8s
        cubic-bezier(.16,1,.3,1)
        .7s
        forwards;
}


/* moving highlight */

.search-button::before {
    content: "";

    position: absolute;

    top: 0;
    left: -130%;

    width: 75%;
    height: 100%;

    background:
        linear-gradient(
            100deg,
            transparent,
            rgba(255,255,255,0.25),
            transparent
        );

    transform:
        skewX(-22deg);

    animation:
        buttonShine
        4s
        ease-in-out
        1.5s
        infinite;
}


.search-button::after {
    content: "";

    position: absolute;

    inset: 0;

    border-radius: inherit;

    box-shadow:
        inset 0 0 0 1px
        rgba(255,255,255,0.08);

    pointer-events: none;
}


.search-button:hover {
    transform:
        translateY(-3px);

    filter:
        brightness(1.06);

    box-shadow:
        0 20px 45px
        rgba(0,0,0,0.45),

        0 0 28px
        rgba(210,174,99,0.12);
}


.search-button:active {
    transform:
        translateY(-1px);
}


.search-button:disabled {
    opacity: .72;

    cursor: wait;

    transform: none;
}


/* =========================================================
   ALERT
========================================================= */

.alert {
    padding:
        18px 20px;

    margin-bottom: 36px;

    border-radius: 13px;

    font-size: 15px;

    font-weight: 550;

    animation:
        alertReveal
        .5s
        cubic-bezier(.16,1,.3,1)
        forwards;
}


.success {
    color:
        #86e5b0;

    background:
        linear-gradient(
            135deg,
            rgba(40,130,82,0.14),
            rgba(20,70,45,0.08)
        );

    border:
        1px solid
        rgba(89,196,132,0.22);

    box-shadow:
        0 10px 30px
        rgba(0,0,0,0.16);
}


.error {
    color:
        #ffaaa5;

    background:
        linear-gradient(
            135deg,
            rgba(150,50,45,0.14),
            rgba(80,25,25,0.08)
        );

    border:
        1px solid
        rgba(220,100,95,0.22);
}


.warning {
    color:
        #e9c978;

    background:
        linear-gradient(
            135deg,
            rgba(160,125,48,0.13),
            rgba(80,60,20,0.07)
        );

    border:
        1px solid
        rgba(205,169,82,0.22);
}


.hidden {
    display: none;
}


/* =========================================================
   LOADING
========================================================= */

.loading {
    display:
        inline-flex;

    align-items:
        center;

    justify-content:
        center;

    gap:
        9px;
}


.spinner {
    width:
        16px;

    height:
        16px;

    border:
        2px solid
        rgba(255,255,255,0.30);

    border-top-color:
        #ffffff;

    border-radius:
        50%;

    animation:
        spin
        .75s
        linear
        infinite;
}


/* =========================================================
   ROOM AVAILABILITY SUMMARY
   🔒 KEEPING THIS SECTION UNCHANGED
========================================================= */

.summary-header {
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:17px;
}

.summary-title {
    font-size:30px;
    font-weight:750;
}

.copy-button {
    min-width:42px;
    height:42px;
    border:1px solid rgba(128,128,128,.45);
    border-radius:8px;
    background:transparent;
    font-size:18px;
    cursor:pointer;
    padding:0 10px;
    white-space:nowrap;
    color: inherit;
}

.copy-button.copied {
    min-width:88px;
    font-size:14px;
    font-weight:600;
}

.summary-intro {
    font-size:16px;
    font-weight:600;
    line-height:1.5;
    margin-bottom:10px;
}

.room-line {
    font-size:16px;
    line-height:1.5;
    margin:0;
}


/* =========================================================
   ANIMATIONS
========================================================= */

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}


@keyframes headerReveal {

    from {
        opacity: 0;

        transform:
            translateY(-25px)
            scale(.97);
    }

    to {
        opacity: 1;

        transform:
            translateY(0)
            scale(1);
    }
}


@keyframes fadeUp {

    from {
        opacity: 0;

        transform:
            translateY(20px);
    }

    to {
        opacity: 1;

        transform:
            translateY(0);
    }
}


@keyframes buttonReveal {

    from {
        opacity: 0;

        transform:
            translateY(20px)
            scale(.985);
    }

    to {
        opacity: 1;

        transform:
            translateY(0)
            scale(1);
    }
}


@keyframes alertReveal {

    from {
        opacity: 0;

        transform:
            translateY(-8px)
            scale(.985);
    }

    to {
        opacity: 1;

        transform:
            translateY(0)
            scale(1);
    }
}


@keyframes iconFloat {

    0%,
    100% {
        transform:
            translateY(0);
    }

    50% {
        transform:
            translateY(-5px);
    }
}


@keyframes ambientGlow {

    from {
        transform:
            translateX(-50%)
            scale(.95);

        opacity: .65;
    }

    to {
        transform:
            translateX(-50%)
            scale(1.08);

        opacity: 1;
    }
}


@keyframes lightSweep {

    from {
        transform:
            translateX(-3%);
    }

    to {
        transform:
            translateX(3%);
    }
}


@keyframes lineReveal {

    from {
        width: 0;

        opacity: 0;
    }

    to {
        width: 52px;

        opacity: 1;
    }
}


@keyframes buttonShine {

    0% {
        left: -130%;
    }

    25% {
        left: 150%;
    }

    100% {
        left: 150%;
    }
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:768px) {

    .container {
        padding:
            32px 18px 45px;
    }


    .header {
        gap: 13px;
    }


    .hotel-icon {
        width: 50px;
        height: 50px;

        border-radius: 15px;

        font-size: 28px;
    }


    .title {
        font-size: 29px;

        letter-spacing:
            -1px;
    }


    .subtitle {
        margin:
            9px 0 32px 63px;

        font-size: 17px;
    }


    .date-grid {
        grid-template-columns:
            1fr;

        gap: 19px;
    }


    .field input {
        height: 54px;
    }


    .search-button {
        min-height: 55px;
    }


    .summary-title {
        font-size: 25px;
    }


    .summary-intro,
    .room-line {
        font-size: 15px;
    }
}


/* =========================================================
   SMALL MOBILE
========================================================= */

@media(max-width:420px) {

    .container {
        padding:
            25px 15px 40px;
    }


    .hotel-icon {
        width: 45px;
        height: 45px;

        font-size: 25px;
    }


    .title {
        font-size: 25px;
    }


    .subtitle {
        margin-left:
            58px;

        font-size:
            16px;
    }


    .summary-title {
        font-size:
            22px;
    }
}

</style>
</head>


<body>

<div class="container">

<div class="header">

    <div class="hotel-icon">
        🏔️
    </div>

    <div class="title">
        Everest Base Camp
    </div>

</div>


<div class="subtitle">
    Room Availability &amp; Price Checker
</div>


<div class="date-grid">

    <div class="field">

        <label for="checkIn">
            Check-in Date
        </label>

        <input
            type="date"
            id="checkIn"
        >

    </div>


    <div class="field">

        <label for="checkOut">
            Check-out Date
        </label>

        <input
            type="date"
            id="checkOut"
        >

    </div>

</div>


<button
    class="search-button"
    id="searchButton"
    onclick="checkAvailability()"
>
    🔍 Check Availability
</button>


<div
    id="alert"
    class="alert hidden"
></div>


<!-- =====================================================
     ROOM AVAILABILITY SUMMARY
     ORIGINAL SECTION
====================================================== -->

<div
    id="summary"
    class="hidden"
>

    <div class="summary-header">

        <div class="summary-title">
            Room Availability Summary
        </div>

        <button
            id="copyButton"
            class="copy-button"
            onclick="copySummary()"
            title="Copy Summary"
        >
            📋
        </button>

    </div>

    <div id="summaryContent"></div>

</div>

</div>


<script>

/* =========================================================
   ELEMENTS
========================================================= */

const checkIn =
    document.getElementById("checkIn");

const checkOut =
    document.getElementById("checkOut");

const searchButton =
    document.getElementById("searchButton");

const alertBox =
    document.getElementById("alert");

const summary =
    document.getElementById("summary");

const summaryContent =
    document.getElementById("summaryContent");

const copyButton =
    document.getElementById("copyButton");


/* =========================================================
   DATE HELPERS
========================================================= */

function toISODate(d) {

    return `${d.getFullYear()}-${String(
        d.getMonth()+1
    ).padStart(2,"0")}-${String(
        d.getDate()
    ).padStart(2,"0")}`;

}


function formatDate(d) {

    return `${String(
        d.getDate()
    ).padStart(2,"0")}-${String(
        d.getMonth()+1
    ).padStart(2,"0")}-${d.getFullYear()}`;

}


function nextDay(s) {

    const d =
        new Date(s+"T00:00:00");

    d.setDate(
        d.getDate()+1
    );

    return toISODate(d);

}


/* =========================================================
   INITIAL DATES
========================================================= */

const today =
    new Date();

const tomorrow =
    new Date();

tomorrow.setDate(
    tomorrow.getDate()+1
);

checkIn.value =
    toISODate(today);

checkOut.value =
    toISODate(tomorrow);

checkIn.min =
    toISODate(today);


/* =========================================================
   DATE EVENTS
========================================================= */

checkIn.addEventListener(
    "change",
    () => {

        if (!checkIn.value)
            return;

        checkOut.min =
            nextDay(checkIn.value);

        checkOut.value =
            nextDay(checkIn.value);

    }
);


checkOut.addEventListener(
    "change",
    () => {

        if (
            checkIn.value &&
            checkOut.value <
            nextDay(checkIn.value)
        ) {

            checkOut.value =
                nextDay(checkIn.value);

        }

    }
);


/* =========================================================
   ALERT
========================================================= */

function showAlert(m,t) {

    alertBox.className =
        "alert "+t;

    alertBox.textContent =
        m;

    alertBox.classList.remove(
        "hidden"
    );

}


function hideAlert() {

    alertBox.classList.add(
        "hidden"
    );

}


/* =========================================================
   OCCUPANTS
========================================================= */

function getOccupants(n) {

    return n ===
        "The Surveyor suite room"
        ? 4
        : 2;

}


/* =========================================================
   ROOM LINE
   ORIGINAL
========================================================= */

function buildRoomLine(r){

    let p =
        Number(r.price)
        .toLocaleString("en-IN");

    let line =
        `${r.name} (${getOccupants(r.name)} occupants) is available for Rs. ${p} plus taxes per night.`;

    if(
        r.name==="The Glamper room" &&
        r.available>0
    )

        line +=
            ` (We have ${r.available} Glamper room${r.available===1?"":"s"})`;

    else if(
        r.name==="The Camper room" &&
        r.available>0
    )

        line +=
            ` (We have ${r.available} Camper room${r.available===1?"":"s"})`;

    else if(
        r.name==="The Surveyor room" &&
        r.available>0
    )

        line +=
            ` (We have ${r.available} Surveyor room${r.available===1?"":"s"})`;

    else if(
        r.name==="The Surveyor suite room" &&
        r.available>0
    )

        line +=
            ` (We have ${r.available} Surveyor suite room${r.available===1?"":"s"})`;

    else if(
        r.name==="The Zenith luxury cottage" &&
        r.available>0
    )

        line +=
            ` (We have ${r.available} Zenith luxury cottage${r.available===1?"":"s"})`;

    else if(
        r.name==="The Twin luxury cottage"
    )

        line +=
            " (2 Rooms next to each other)";

    else if(
        r.name==="The Villa"
    )

        line +=
            " (2 Rooms villa)";

    return line;

}


/* =========================================================
   AVAILABILITY
========================================================= */

async function checkAvailability(){

    hideAlert();

    summary.classList.add(
        "hidden"
    );

    const start =
        checkIn.value;

    const end =
        checkOut.value;


    if(!start||!end){

        showAlert(
            "Please select both dates.",
            "error"
        );

        return;

    }


    if(end<=start){

        showAlert(
            "Check-out date must be after check-in date.",
            "error"
        );

        return;

    }


    searchButton.disabled =
        true;

    searchButton.innerHTML =
        '<span class="loading"><span class="spinner"></span>Fetching live availability...</span>';


    try{

        const response =
            await fetch(
                `/api/availability?check_in=${encodeURIComponent(start)}&check_out=${encodeURIComponent(end)}&adults=2&children=0&rooms=1`
            );


        let data;

        try{

            data =
                await response.json();

        }

        catch{

            throw new Error(
                "The server returned an invalid response."
            );

        }


        if(!response.ok)

            throw new Error(
                data.detail||
                "Unable to fetch room availability."
            );


        if(
            !data.available||
            !data.rooms||
            !data.rooms.length
        ){

            showAlert(
                "No rooms are available for the selected dates.",
                "warning"
            );

            return;

        }


        showAlert(
            "Availability fetched successfully!",
            "success"
        );


        renderSummary(data);

    }

    catch(e){

        showAlert(
            e.message||
            "Unable to fetch room availability.",
            "error"
        );

    }

    finally{

        searchButton.disabled =
            false;

        searchButton.innerHTML =
            "🔍 Check Availability";

    }

}


/* =========================================================
   SUMMARY
   ORIGINAL
========================================================= */

function renderSummary(data){

    const s =
        new Date(
            data.check_in+
            "T00:00:00"
        );

    const e =
        new Date(
            data.check_out+
            "T00:00:00"
        );

    const dateText =
        `${formatDate(s)} - ${formatDate(e)}`;

    let html =
        `<div class="summary-intro">For ${dateText}, Here is the Room availability with prices below:</div>`;

    for(
        const r of data.rooms
    )

        html +=
            `<div class="room-line">${escapeHtml(buildRoomLine(r))}</div>`;

    summaryContent.innerHTML =
        html;

    summary.classList.remove(
        "hidden"
    );

    window.summaryCopyText =
        buildCopyText(data);

}


/* =========================================================
   COPY
========================================================= */

function buildCopyText(data){

    const s =
        new Date(
            data.check_in+
            "T00:00:00"
        );

    const e =
        new Date(
            data.check_out+
            "T00:00:00"
        );

    const lines=[
        `For ${formatDate(s)} - ${formatDate(e)}, Here is the Room availability with prices below:`
    ];

    for(
        const r of data.rooms
    )

        lines.push(
            buildRoomLine(r)
        );

    return lines.join("\n");

}


async function copySummary(){

    const text =
        window.summaryCopyText||
        "";

    if(!text)
        return;

    try{

        await navigator.clipboard
            .writeText(text);

        showCopied();

    }

    catch{

        const t =
            document.createElement(
                "textarea"
            );

        t.value =
            text;

        t.style.position =
            "fixed";

        t.style.left =
            "-999999px";

        document.body.appendChild(
            t
        );

        t.focus();

        t.select();

        let ok=false;

        try{

            ok =
                document.execCommand(
                    "copy"
                );

        }

        catch{}

        t.remove();

        if(ok)

            showCopied();

        else{

            copyButton.innerHTML =
                "✕ Failed";

            setTimeout(
                resetCopyButton,
                1800
            );

        }

    }

}


function showCopied(){

    copyButton.innerHTML =
        "✓ Copied";

    copyButton.classList.add(
        "copied"
    );

    copyButton.title =
        "Copied";

    setTimeout(
        resetCopyButton,
        1500
    );

}


function resetCopyButton(){

    copyButton.innerHTML =
        "📋";

    copyButton.classList.remove(
        "copied"
    );

    copyButton.title =
        "Copy Summary";

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(v){

    return String(v)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}
